name: Hendrix 1.1 Windows and Linux plugins
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/hendrix-platforms.yml"]
permissions:
  contents: read

jobs:
  plugins:
    name: ${{ matrix.os }} x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            library: libhendrix_audio_to_midi.so
            validator: validator
          - os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            library: hendrix_audio_to_midi.dll
            validator: validator.exe
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics and audio development libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-icccm4-dev \
            libxcb-util-dev libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxext-dev libgl1-mesa-dev libasound2-dev libjack-jackd2-dev xvfb
      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target "${{ matrix.target }}"
          echo 'RUSTUP_TOOLCHAIN=1.95.0' >> "$GITHUB_ENV"
      - name: Set Hendrix 1.1 release version
        shell: bash
        run: |
          python - <<'PY_VERSION'
          from pathlib import Path
          for name in ("Cargo.toml", "Cargo.lock"):
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              old = 'name = "hendrix-audio-to-midi"\nversion = "1.0.0"'
              assert text.count(old) == 1
              p.write_text(text.replace(old, old.replace("1.0.0", "1.1.0")), encoding="utf-8")
          p = Path("portable.rs")
          text = p.read_text(encoding="utf-8")
          old = 'const VERSION: &\'static str = "1.0.0";'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'const VERSION: &\'static str = env!("CARGO_PKG_VERSION");'), encoding="utf-8")
          p = Path("package_portable.py")
          text = p.read_text(encoding="utf-8")
          for old, new in (("Hendrix-1.0", "Hendrix-1.1"), ("Hendrix 1.0", "Hendrix 1.1"), ("HENDRIX 1.0", "HENDRIX 1.1")):
              text = text.replace(old, new)
          p.write_text(text, encoding="utf-8")
          PY_VERSION
      - name: Test the engine and build both plugin entry points
        shell: bash
        run: |
          cargo test --locked --release --features portable
          cargo build --locked --release --features portable --target "${{ matrix.target }}"
      - name: Build the official VST3 validator
        shell: bash
        run: |
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk checkout --detach 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C vst3sdk submodule update --init --depth 1 -- base cmake pluginterfaces public.sdk
          cmake -S vst3sdk -B vst3validator -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          cmake --build vst3validator --config Release --target validator --parallel 2
      - name: Package and test the resulting plugin binaries
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.os }}"
          target="${{ matrix.target }}"
          display="Linux"
          if [[ "$platform" == windows ]]; then display="Windows"; fi
          python package_portable.py "$platform" "$target" \
            "target/$target/release/${{ matrix.library }}" dist
          pkg="dist/Hendrix-1.1-$display-x86_64-CLAP-VST3"
          python ClapProbe.py "$pkg/Hendrix.clap" | tee dist/CLAP-test.txt
          validator=$(find vst3validator/bin -type f -name "${{ matrix.validator }}" -print -quit)
          test -n "$validator"
          if [[ "$platform" == linux ]]; then
            xvfb-run -a "$validator" "$pkg/Hendrix.vst3" | tee dist/VST3-test.txt
          else
            "$validator" "$pkg/Hendrix.vst3" | tee dist/VST3-test.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Hendrix-1.1-${{ matrix.os }}-x86_64
          path: |
            dist/*.zip
            dist/*-test.txt
          if-no-files-found: error
          retention-days: 7

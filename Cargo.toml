[package]
name = "hendrix-audio-to-midi"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Moonshroom Studio"]
description = "First-cycle mono and polyphonic audio-to-MIDI detection with pitch bends"
repository = "https://github.com/moonshroom303/hendrix"
homepage = "https://moonshroom.moonshroom303.chatgpt.site/"
readme = "README.md"
exclude = ["target", "*.zip"]

[lib]
path = "lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
gui = ["dep:egui", "dep:image"]
preview = ["gui", "dep:eframe"]
portable = ["dep:nice-plug", "dep:nice-plug-egui", "dep:portable-egui", "dep:image"]

[dependencies]
rustfft = "=6.4.1"
nice-plug = { version = "=0.4.2", default-features = false, features = ["vst3", "editor", "tracing-subscriber"], optional = true }
nice-plug-egui = { version = "=0.6.0", optional = true }
portable-egui = { package = "egui", version = "=0.37.0", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { version = "=0.33.3", optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow"], optional = true }

[[example]]
name = "first_note"
path = "first_note.rs"

[[bin]]
name = "hendrix-preview"
path = "preview.rs"
required-features = ["preview"]

[workspace]
